<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>极速赛车</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#222;
    font-family:sans-serif;
}

#road{
    position:relative;
    width:100vw;
    height:100vh;
    background:#444;
    overflow:hidden;
}

#score{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:28px;
    z-index:999;
}

#car{
    position:absolute;
    width:60px;
    height:100px;
    background:red;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    border-radius:10px;
}

.enemy{
    position:absolute;
    width:60px;
    height:100px;
    background:yellow;
    border-radius:10px;
}

#line{
    position:absolute;
    left:50%;
    width:8px;
    height:100%;
    transform:translateX(-50%);
    background:
    repeating-linear-gradient(
    white 0px,
    white 30px,
    transparent 30px,
    transparent 60px);
}

#gameover{
    display:none;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    z-index:9999;
}

button{
    font-size:20px;
    padding:10px 20px;
}
</style>
</head>

<body>

<div id="road">

<div id="line"></div>

<div id="score">0</div>

<div id="car"></div>

<div id="gameover">
<h2>游戏结束</h2>
<p id="finalScore"></p>
<button onclick="location.reload()">
重新开始
</button>
</div>

</div>

<script>

const car=document.getElementById("car");
const road=document.getElementById("road");

let score=0;
let game=true;

let carX=window.innerWidth/2-30;

function updateCar(){
    car.style.left=carX+"px";
}

function left(){
    carX-=40;
    if(carX<0) carX=0;
    updateCar();
}

function right(){
    carX+=40;
    if(carX>window.innerWidth-60)
        carX=window.innerWidth-60;
    updateCar();
}

document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft") left();
    if(e.key==="ArrowRight") right();
});

document.addEventListener("touchstart",e=>{
    if(e.touches[0].clientX<window.innerWidth/2)
        left();
    else
        right();
});

function createEnemy(){

    if(!game) return;

    let enemy=document.createElement("div");

    enemy.className="enemy";

    enemy.style.left=
    Math.random()*(window.innerWidth-60)+"px";

    enemy.style.top="-100px";

    road.appendChild(enemy);

    let y=-100;

    let timer=setInterval(()=>{

        if(!game){
            clearInterval(timer);
            return;
        }

        y+=8;

        enemy.style.top=y+"px";

        let carRect=
        car.getBoundingClientRect();

        let enemyRect=
        enemy.getBoundingClientRect();

        if(
        carRect.left<enemyRect.right &&
        carRect.right>enemyRect.left &&
        carRect.top<enemyRect.bottom &&
        carRect.bottom>enemyRect.top
        ){

            game=false;

            document.getElementById(
            "finalScore"
            ).innerText=
            "最终得分："+score;

            document.getElementById(
            "gameover"
            ).style.display="block";
        }

        if(y>window.innerHeight){
            score++;
            document.getElementById(
            "score"
            ).innerText=score;

            enemy.remove();
            clearInterval(timer);
        }

    },20);

}

setInterval(createEnemy,800);

</script>

</body>
</html>
