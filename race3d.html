<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Racing</title>

<style>
body{
    margin:0;
    overflow:hidden;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>

<script>

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// 相机
const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

// 渲染器
const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

// 光照
scene.add(
new THREE.AmbientLight(
0xffffff,
1.2
)
);

const sun =
new THREE.DirectionalLight(
0xffffff,
2
);

sun.position.set(10,20,10);

scene.add(sun);

// 地面
const ground =
new THREE.Mesh(
new THREE.PlaneGeometry(500,500),
new THREE.MeshStandardMaterial({
color:0x3c8d2f
})
);

ground.rotation.x =
-Math.PI/2;

scene.add(ground);

// 赛道
const road =
new THREE.Mesh(
new THREE.BoxGeometry(
12,
0.1,
500
),
new THREE.MeshStandardMaterial({
color:0x333333
})
);

scene.add(road);

// ===== 赛车 =====

const car =
new THREE.Group();

const body =
new THREE.Mesh(
new THREE.BoxGeometry(
2,
0.8,
4
),
new THREE.MeshStandardMaterial({
color:0xff0000
})
);

body.position.y = 1;

car.add(body);

// 车顶
const top =
new THREE.Mesh(
new THREE.BoxGeometry(
1.5,
0.7,
2
),
new THREE.MeshStandardMaterial({
color:0xaa0000
})
);

top.position.set(
0,
1.7,
0
);

car.add(top);

// 轮子
for(let x of [-1,1]){
for(let z of [-1.5,1.5]){

const wheel =
new THREE.Mesh(
new THREE.CylinderGeometry(
0.4,
0.4,
0.5,
20
),
new THREE.MeshStandardMaterial({
color:0x111111
})
);

wheel.rotation.z =
Math.PI/2;

wheel.position.set(
x,
0.4,
z
);

car.add(wheel);

}
}

scene.add(car);

car.position.y = 0;

// 控制
const keys = {};

window.addEventListener(
"keydown",
e=>keys[e.key]=true
);

window.addEventListener(
"keyup",
e=>keys[e.key]=false
);

let speed = 0;
let angle = 0;

function animate(){

requestAnimationFrame(
animate
);

if(keys["ArrowUp"] ||
keys["w"])
speed += 0.005;

if(keys["ArrowDown"] ||
keys["s"])
speed -= 0.005;

speed *= 0.98;

if(speed > 0.5)
speed = 0.5;

if(speed < -0.2)
speed = -0.2;

if(keys["ArrowLeft"] ||
keys["a"])
angle += 0.03;

if(keys["ArrowRight"] ||
keys["d"])
angle -= 0.03;

car.rotation.y =
angle;

car.position.x +=
Math.sin(angle)
* speed;

car.position.z +=
Math.cos(angle)
* speed;

// 摄像机跟随
camera.position.x =
car.position.x -
Math.sin(angle)*8;

camera.position.y = 5;

camera.position.z =
car.position.z -
Math.cos(angle)*8;

camera.lookAt(
car.position.x,
1,
car.position.z
);

renderer.render(
scene,
camera
);

}

animate();

</script>

</body>
</html>
